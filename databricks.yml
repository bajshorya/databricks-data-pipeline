bundle:
  name: databricks_data_pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog
    default: workspace

targets:
  dev:
    # No `mode: development`: it forces schedules to stay paused, and the job runs monthly.
    default: true
    workspace:
      host: https://dbc-c6a80f71-6f05.cloud.databricks.com
