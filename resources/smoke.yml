resources:
  jobs:
    partd_smoke:
      name: partd_smoke
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        - task_key: smoke_test
          environment_key: default
          spark_python_task:
            python_file: ../jobs/smoke_test.py
            parameters:
              - "--src-path=${workspace.file_path}/src"
              - "--config-dir=${workspace.file_path}/config"
              - "--catalog=${var.catalog}"
